<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex">
    <title>DANDYSHOES | Pro Area</title>
    <link rel="stylesheet" href="/css/dist/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="icon" href="/favicon.ico" type="image/x-icon">
</head>
<body>
    <div class="password-overlay" id="passwordOverlay">
        <form class="password-form" method="post" action="/pro">
            <h2>🎸 PRO ACCESS</h2>
            <p style="color: var(--light); margin-bottom: 2rem;">Accès réservé aux organisateurs et professionnels</p>
            <input type="password" class="password-input" name="password" placeholder="Mot de passe" aria-label="Mot de passe" autocomplete="current-password" required autofocus>
            <button type="submit" class="password-submit">Accéder</button>
            {{ERROR}}
            <p style="margin-top: 2rem;"><a href="/" style="color: var(--primary);">← Retour au site</a></p>
        </form>
    </div>
</body>
</html>
